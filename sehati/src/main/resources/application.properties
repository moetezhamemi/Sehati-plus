spring.application.name=sehati
server.port=6060

# === BASE DE DONNÉES ===
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sehati_db?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# === JPA ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# === MULTIPART ===
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# === JWT ===
sehati.app.jwtSecret=${SEHATI_APP_JWTSECRET}
sehati.app.jwtExpirationMs=${SEHATI_APP_JWTEXPIRATIONMS:86400000}

# === EMAIL SMTP ===
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
sehati.mail.from=${SEHATI_MAIL_FROM:${SPRING_MAIL_USERNAME:}}

# === CLOUDINARY ===
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# === TWILIO (SMS OTP) ===
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.service-sid=${TWILIO_SERVICE_SID}

# === GROQ AI (Whisper transcription uniquement) ===
groq.api-key=${GROQ_API_KEY}

# === OPENROUTER AI ===
openrouter.api-key=${OPENROUTER_API_KEY}

# === REDIS ===
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# === FRONTEND ===
sehati.frontend.base-url=${SEHATI_FRONTEND_BASE_URL:http://localhost:4200}

# === SPRING AI (OPENAI COMPATIBLE - OPENROUTER) ===
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b:free
spring.ai.openai.chat.options.temperature=0.5